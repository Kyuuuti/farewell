<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Press Me</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-indigo-500 selection:text-white relative overflow-hidden">

    <main class="flex items-center justify-center w-full h-full">
        <button 
            id="pressBtn"
            type="button"
            class="relative group px-8 py-4 sm:px-10 sm:py-5 text-lg sm:text-xl font-medium rounded-2xl bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-white shadow-lg shadow-indigo-500/30 hover:shadow-indigo-500/50 hover:scale-105 active:scale-95 transition-all duration-300 ease-out focus:outline-none focus:ring-4 focus:ring-indigo-500/40 cursor-pointer overflow-hidden"
            aria-label="Press Me Button"
        >
            <!-- Background Glow Effect on Hover -->
            <span class="absolute inset-0 w-full h-full bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity duration-300 rounded-2xl"></span>
            
            <!-- Button Content -->
            <span class="relative z-10 flex items-center gap-2">
                <span>Press Me</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 group-hover:translate-x-1 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </span>
        </button>
    </main>

    <div id="videoModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300 p-4">
        <div class="relative w-full max-w-4xl bg-slate-800 rounded-2xl border border-slate-700 shadow-2xl overflow-hidden flex flex-col">
            <!-- Modal Header -->
            <div class="p-4 bg-slate-800/80 border-b border-slate-700 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="flex h-3 w-3 relative">
                        <span id="statusPing" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                        <span id="statusDot" class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
                    </span>
                    <h3 id="modalTitle" class="text-sm sm:text-base font-semibold text-slate-200">Playing Video (Locked until finished)</h3>
                </div>
                <!-- Close Button (Initially Hidden/Disabled) -->
                <button 
                    id="closeBtn" 
                    disabled 
                    class="opacity-30 cursor-not-allowed transition-all duration-300 text-slate-400 hover:text-white bg-slate-700/50 hover:bg-slate-700 rounded-lg p-1.5 focus:outline-none"
                    aria-label="Close Video Modal"
                >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <div class="relative w-full aspect-video bg-black flex items-center justify-center">
                <div id="player"></div>
            </div>

            <!-- Footer Warning / Status -->
            <div class="p-3 bg-slate-800/50 border-t border-slate-700/50 text-center text-xs text-slate-400">
                <span id="lockMessage">🔒 You must watch the entire video before you can close this window.</span>
            </div>
        </div>
    </div>

    <script>
        // Load YouTube IFrame Player API script asynchronously
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        let player = null;
        let isApiReady = false;
        let isFinished = false;

        const pressBtn = document.getElementById('pressBtn');
        const videoModal = document.getElementById('videoModal');
        const closeBtn = document.getElementById('closeBtn');
        const modalTitle = document.getElementById('modalTitle');
        const lockMessage = document.getElementById('lockMessage');
        const statusPing = document.getElementById('statusPing');
        const statusDot = document.getElementById('statusDot');

        // Called automatically when YouTube API script is loaded
        function onYouTubeIframeAPIReady() {
            isApiReady = true;
        }

        // Initialize Player with youtube-nocookie and strict origin policies to fix Error 153
        function initPlayer() {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: 'dQw4w9WgXcQ', // Rick Astley - Never Gonna Give You Up
                host: 'https://www.youtube-nocookie.com',
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'disablekb': 1,
                    'modestbranding': 1,
                    'rel': 0,
                    'origin': window.location.origin || window.location.protocol + '//' + window.location.host,
                    'enablejsapi': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });

            // Set explicit referrerpolicy on the iframe element generated by API
            const iframe = document.getElementById('player');
            if (iframe) {
                iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
                iframe.setAttribute('allow', 'autoplay; encrypted-media');
                iframe.className = 'w-full h-full border-0';
            }
        }

        function onPlayerReady(event) {
            event.target.playVideo();
        }

        // Monitor playback states
        function onPlayerStateChange(event) {
            // YT.PlayerState.ENDED === 0
            if (event.data === YT.PlayerState.ENDED) {
                unlockModal();
            }
        }

        function unlockModal() {
            isFinished = true;
            closeBtn.disabled = false;
            closeBtn.classList.remove('opacity-30', 'cursor-not-allowed');
            closeBtn.classList.add('opacity-100', 'hover:bg-red-600', 'text-white', 'cursor-pointer');
            
            modalTitle.textContent = "Video Finished! You may now close.";
            lockMessage.textContent = "✅ Video complete. Click X in the top right corner to close.";
            
            statusPing.classList.remove('bg-red-400');
            statusPing.classList.add('bg-green-400');
            statusDot.classList.remove('bg-red-500');
            statusDot.classList.add('bg-green-500');
        }

        // Handle button click action
        pressBtn.addEventListener('click', function(e) {
            // Ripple animation
            const button = e.currentTarget;
            const circle = document.createElement('span');
            const diameter = Math.max(button.clientWidth, button.clientHeight);
            const radius = diameter / 2;
            const rect = button.getBoundingClientRect();
            
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${e.clientX - rect.left - radius}px`;
            circle.style.top = `${e.clientY - rect.top - radius}px`;
            circle.classList.add('absolute', 'rounded-full', 'bg-white/40', 'animate-ping', 'pointer-events-none');

            const existingRipple = button.getElementsByClassName('animate-ping')[0];
            if (existingRipple) existingRipple.remove();
            button.appendChild(circle);
            setTimeout(() => circle.remove(), 600);

            // Open Modal Overlay
            videoModal.classList.remove('opacity-0', 'pointer-events-none');
            videoModal.classList.add('opacity-100', 'pointer-events-auto');

            // Initialize or play video
            if (!player && isApiReady) {
                initPlayer();
            } else if (player && typeof player.playVideo === 'function') {
                player.playVideo();
            }
        });

        // Close button click handler
        closeBtn.addEventListener('click', function() {
            if (!isFinished) return;
            if (player && typeof player.stopVideo === 'function') {
                player.stopVideo();
            }
            videoModal.classList.add('opacity-0', 'pointer-events-none');
            videoModal.classList.remove('opacity-100', 'pointer-events-auto');
        });

        // Block ESC key closing attempts
        window.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && !isFinished) {
                e.preventDefault();
                e.stopPropagation();
            }
        }, true);
    </script>
</body>
</html>
